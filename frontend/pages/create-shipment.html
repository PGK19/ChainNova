<!-- PAGE: CREATE SHIPMENT -->
<section class="p-4 space-y-6" id="page-create-shipment">
<div class="flex items-center gap-4 mb-2">
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400" onclick="navigateTo('dashboard')">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-xl font-bold">Create New Shipment</h2>
</div>
<form id="create-shipment-form" class="space-y-4">
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-slate-500 uppercase">Origin Facility</label>
<select id="origin" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm p-3 focus:ring-primary">
<option>Chennai Port Hub - TN-01</option>
<option>Coimbatore Logistics Park</option>
<option>Madurai Distribution Center</option>
</select>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-slate-500 uppercase">Destination</label>
<input id="destination" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm p-3 focus:ring-primary" placeholder="Enter delivery address in TN" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-slate-500 uppercase">Load Type</label>
<select id="load-type" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm p-3 focus:ring-primary">
<option>Dry Cargo</option>
<option>Refrigerated</option>
<option>Hazardous</option>
</select>
</div>
<div class="space-y-1.5">
<label class="text-[10px] font-bold text-slate-500 uppercase">Weight (Tons)</label>
<input id="weight" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-sm p-3 focus:ring-primary" placeholder="0.0" step="0.1" type="number"/>
</div>
</div>
</form>
<div class="p-4 bg-primary/5 border border-primary/20 rounded-xl">
<div class="flex gap-3">
<div class="w-8 h-8 shrink-0 bg-primary/20 rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined">smart_toy</span>
</div>
<div>
<p class="text-xs font-bold text-primary">AI Optimization Enabled</p>
<p class="text-[10px] text-slate-400 mt-0.5">We will automatically find the best route and identify potential dead-space sharing opportunities.</p>
</div>
</div>
</div>
<button class="w-full bg-primary py-4 rounded-lg font-bold text-sm shadow-lg shadow-primary/20 text-white" onclick="analyzeShipment()">Analyze &amp; Create</button>
</section>
